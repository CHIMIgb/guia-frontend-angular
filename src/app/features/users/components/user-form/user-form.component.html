<!-- src/app/features/users/components/user-form/user-form.component.html -->
<div class="user-form-container">
  <h2>{{ isEditing() ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>

  <!-- Mensaje de error -->
  @if (errorMsg()) {
    <div class="alert alert-error">
      {{ errorMsg() }}
    </div>
  }

  <!-- Indicador de carga al cargar datos del usuario -->
  @if (isLoading()) {
    <div class="loading">Cargando datos del usuario...</div>
  }

  @if (!isLoading()) {
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <!-- Campo Usuario -->
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            type="text"
            formControlName="usuario"
            placeholder="Nombre de usuario"
          />
        </div>

        <!-- Campo Contraseña (solo en creación, opcional en edición) -->
        <div class="form-group">
          <label for="contrasena">
            Contraseña
            @if (isEditing()) {
              <small>(dejar vacío para no cambiar)</small>
            }
          </label>
          <input
            id="contrasena"
            type="password"
            formControlName="contrasena"
            placeholder="Mínimo 6 caracteres"
          />
        </div>

        <!-- Campo Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input
            id="nombre"
            type="text"
            formControlName="nombre"
            placeholder="Nombre"
          />
        </div>

        <!-- Campo Apellidos -->
        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input
            id="apellidos"
            type="text"
            formControlName="apellidos"
            placeholder="Apellidos"
          />
        </div>

        <!-- Campo Sexo -->
        <div class="form-group" [class.span-2]="isEditing()">
          <label for="sexo">Sexo</label>
          <select id="sexo" formControlName="sexo">
            <option value="">— Seleccionar —</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
          </select>
        </div>

        <!-- Campo Rol (solo en creación) -->
        @if (!isEditing()) {
          <div class="form-group">
            <label for="rol_id">Rol</label>
            <select id="rol_id" formControlName="rol_id">
              @for (rol of ROLES; track rol.id) {
                <option [value]="rol.id">{{ rol.nombre }}</option>
              }
            </select>
          </div>
        }
      </div>

      <!-- Botones -->
      <div class="form-actions">
        <button type="submit" [disabled]="isSaving()" class="btn-save">
          @if (isSaving()) {
            <span>Guardando...</span>
          } @else {
            <span>{{ isEditing() ? 'Actualizar' : 'Crear Usuario' }}</span>
          }
        </button>
        <button type="button" class="btn-cancel" (click)="cancelled.emit()">Cancelar</button>
      </div>
    </form>
  }
</div>
